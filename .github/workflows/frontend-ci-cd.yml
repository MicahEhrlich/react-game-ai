name: Frontend CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run ci:check

  deploy-production:
    name: Deploy frontend production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@59.13.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel project access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const names = ['VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID'];
          for (const name of names) {
            const value = process.env[name];
            if (!value || value !== value.trim() || /[\r\n]/.test(value)) {
              console.error(`::error::${name} is missing or contains surrounding whitespace/newlines. Check Actions secrets and production environment overrides.`);
              process.exit(1);
            }
          }
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!orgId.startsWith('team_') || !projectId.startsWith('prj_')) {
            console.error('::error::Expected a Vercel team ID (team_...) and project ID (prj_...), not names or URLs.');
            process.exit(1);
          }
          const org = encodeURIComponent(orgId);
          const project = encodeURIComponent(projectId);
          let failed = false;
          for (const [label, path] of [
            ['Team lookup', `/teams/${org}?teamId=${org}`],
            ['Project lookup', `/v9/projects/${project}?teamId=${org}`],
          ]) {
            try {
              const response = await fetch(`https://api.vercel.com${path}`, {
                headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
                signal: AbortSignal.timeout(15000),
                redirect: 'error',
              });
              // Never print response bodies: project settings can contain environment values.
              console.log(`${label}: HTTP ${response.status}`);
              if (!response.ok) {
                console.error(`::error::${label} failed. VERCEL_TOKEN must be scoped to the Vercel team that owns this project.`);
                failed = true;
              }
              await response.body?.cancel();
            } catch {
              console.error(`::error::${label} could not complete; check Vercel API availability and retry.`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Pull Vercel production configuration
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Smoke test production deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --output response.html \
            "$DEPLOYMENT_URL"
          grep --fixed-strings --quiet '<title>Glitch Shift Arcade</title>' response.html
