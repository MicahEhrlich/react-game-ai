name: Frontend CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run ci:check

  deploy-production:
    name: Deploy frontend production
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: react-game-ai
      VERCEL_PRODUCTION_URL: https://react-game-ai.vercel.app

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Deploy passing commit to Vercel
        id: deploy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';

          const names = ['VERCEL_TOKEN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID'];
          for (const name of names) {
            const value = process.env[name];
            if (!value || value !== value.trim() || /[\r\n]/.test(value)) {
              console.error(`::error::${name} is missing or contains surrounding whitespace/newlines. Check the repository's Actions secrets.`);
              process.exit(1);
            }
          }
          const orgId = process.env.VERCEL_ORG_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          if (!orgId.startsWith('team_') || !projectId.startsWith('prj_')) {
            console.error('::error::Expected a Vercel team ID (team_...) and project ID (prj_...), not names or URLs.');
            process.exit(1);
          }
          const [gitOrg, gitRepo] = process.env.GITHUB_REPOSITORY.split('/');
          if (!gitOrg || !gitRepo) {
            console.error('::error::GitHub did not provide a valid owner/repository identifier.');
            process.exit(1);
          }

          const apiUrl = new URL('https://api.vercel.com/v13/deployments');
          apiUrl.searchParams.set('teamId', orgId);
          apiUrl.searchParams.set('forceNew', '1');
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.VERCEL_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              name: process.env.VERCEL_PROJECT_NAME,
              project: projectId,
              target: 'production',
              gitSource: {
                type: 'github',
                org: gitOrg,
                repo: gitRepo,
                ref: process.env.GITHUB_REF_NAME,
                sha: process.env.GITHUB_SHA,
              },
            }),
            signal: AbortSignal.timeout(30000),
            redirect: 'error',
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || typeof body.id !== 'string') {
            const code = typeof body.error?.code === 'string' ? ` (${body.error.code})` : '';
            console.error(`::error::Vercel deployment creation failed with HTTP ${response.status}${code}.`);
            process.exit(1);
          }
          console.log(`Created Vercel deployment ${body.id} for commit ${process.env.GITHUB_SHA}.`);
          await appendFile(process.env.GITHUB_OUTPUT, `deployment_id=${body.id}\n`);
          NODE

      - name: Wait for Vercel deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises';

          const deploymentId = process.env.DEPLOYMENT_ID;
          const apiUrl = new URL(`https://api.vercel.com/v13/deployments/${encodeURIComponent(deploymentId)}`);
          apiUrl.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const terminalFailures = new Set(['ERROR', 'CANCELED']);

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(apiUrl, {
              headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
              signal: AbortSignal.timeout(15000),
              redirect: 'error',
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) {
              console.error(`::error::Vercel deployment status failed with HTTP ${response.status}.`);
              process.exit(1);
            }
            console.log(`Vercel deployment state: ${body.readyState ?? 'UNKNOWN'}`);
            if (body.readyState === 'READY') {
              process.exit(0);
            }
            if (terminalFailures.has(body.readyState)) {
              console.error(`::error::Vercel deployment ended in ${body.readyState}.`);
              process.exit(1);
            }
            await delay(5000);
          }
          console.error('::error::Vercel deployment did not become ready within five minutes.');
          process.exit(1);
          NODE
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}

      - name: Smoke test production deployment
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --output response.html \
            "$VERCEL_PRODUCTION_URL"
          grep --fixed-strings --quiet '<title>Glitch Shift Arcade</title>' response.html
